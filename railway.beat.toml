# =============================================================================
# BAALEBOS CLOUD — Railway Beat Scheduler Config
# =============================================================================
# Create a THIRD service in Railway pointing to the same repo.
# Set the start command override in Railway dashboard to this:
#   celery -A backend.app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
 
[deploy]
startCommand = "/app/backend/start-beat.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
