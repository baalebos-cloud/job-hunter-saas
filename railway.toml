# =============================================================================
# BAALEBOS CLOUD — Railway Deployment Configuration
# =============================================================================
# Railway reads this file to know how to build and run each service.
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips *"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
