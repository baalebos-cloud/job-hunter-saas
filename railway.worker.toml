# =============================================================================
# BAALEBOS CLOUD — Railway Worker Service Config
# =============================================================================
# In Railway dashboard → worker service → Settings → Config File Path
# set this to: railway.worker.toml
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "/app/start-worker.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
