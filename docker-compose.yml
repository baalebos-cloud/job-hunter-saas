version: "3.8"

services:
  # 🌐 THE API SERVER (FastAPI)
  web:
    # 1. ADD BUILD CONTEXT: This lets you run 'docker-compose build' locally
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 2. UPDATED IMAGE: Using your provided Account ID
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:latest
    container_name: job-hunter-saas_web_1
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - PYTHONPATH=/app
    # Added --forwarded-allow-ips='*' to help FastAPI trust the AWS Load Balancer
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips='*'"]
    healthcheck:
      # Changed to use --fail so it reflects exactly what the ALB sees
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - redis
    networks:
      - job-hunter-network

  # 🧠 THE AI WORKER (Celery)
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:latest
    container_name: job-hunter-saas_worker_1
    restart: always
    command: ["celery", "-A", "backend.app.celery_app", "worker", "--loglevel=info", "-E", "--autoscale=4,1"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
    networks:
      - job-hunter-network

  # 📥 LOCAL REDIS
  redis:
    image: redis:7-alpine
    container_name: job-hunter-saas_redis_1
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - job-hunter-network
    volumes:
      - redis_data:/data

networks:
  job-hunter-network:
    driver: bridge

volumes:
  app_logs:
  redis_data:
