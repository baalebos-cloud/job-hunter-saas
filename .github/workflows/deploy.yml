name: 🚀 Baalebos AI Production Pipeline

on:
  push:
    branches: [ "main" ]

env:
  ECR_REGISTRY_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 📦 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build and Push Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ./backend/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest -f ./job-hunter-dashboard/Dockerfile ./job-hunter-dashboard
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOSTS }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # CRITICAL: List all secrets that need to be passed to the remote shell
          envs: OPENROUTER_API_KEY, DATABASE_URL, AWS_REGION, ECR_REPOSITORY
        with:
          script: |
            cd /home/${{ secrets.EC2_USER }}/job-hunter-saas/
            
            # 1. Map GitHub Secrets to Shell Environment Variables
            export OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            export DATABASE_URL=${{ secrets.DATABASE_URL }}
            export ECR_REGISTRY=${{ env.ECR_REGISTRY_URL }}
            export ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}

            # 2. Authenticate Docker with AWS ECR
            aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

            # 3. Pull and Restart Services
            # -E is vital: it tells sudo to keep the environment variables we just exported
            sudo -E docker-compose -f docker-compose.prod.yml pull
            sudo -E docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 4. Clean up old images to save space on your 8GB volume
            sudo docker image prune -a -f
