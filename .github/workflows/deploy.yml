name: Baalebos AI Production Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 📦 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build and Push Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          # Build Backend/Worker
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ./backend/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Build Frontend (with Tailwind v4)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest -f ./job-hunter-dashboard/Dockerfile ./job-hunter-dashboard
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOSTS }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/job-hunter-saas/
            
            # 1. Login to ECR on EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # 2. Pull the fresh images
            sudo docker-compose -f docker-compose.prod.yml pull
            
            # 3. Clean up old layers to save space on your 8GB volume
            sudo docker builder prune -f
            
            # 4. Restart the stack
            sudo docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 5. Final prune of dangling images
            sudo docker image prune -f
