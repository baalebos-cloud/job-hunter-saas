name: 🚀 Baalebos Cloud — Deploy to Railway + Vercel

on:
  push:
    branches: [ "main" ]

jobs:
  # ── Deploy Backend to Railway ──────────────────────────────────────────────
  deploy-backend:
    name: 🚂 Deploy Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_ID_BACKEND }}

  # ── Deploy Worker to Railway ───────────────────────────────────────────────
  deploy-worker:
    name: ⚙️ Deploy Worker → Railway
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy Worker to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_ID_WORKER }}

  # ── Deploy Beat to Railway ─────────────────────────────────────────────────
  deploy-beat:
    name: ⏰ Deploy Beat → Railway
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy Beat to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_ID_BEAT }}

  # ── Deploy Frontend to Vercel ──────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel

      - name: 🌐 Deploy to Vercel
        working-directory: job-hunter-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
