name: ✅ Baalebos Cloud — CI Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Backend syntax check ───────────────────────────────────────────────────
  backend-check:
    name: 🐍 Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ✅ Check Python syntax
        run: |
          find backend/ -name "*.py" -exec python3 -m py_compile {} \;
          echo "✅ All Python files syntax OK"

  # ── Frontend build check ───────────────────────────────────────────────────
  frontend-check:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: job-hunter-dashboard/package-lock.json

      - name: 📦 Install dependencies
        working-directory: job-hunter-dashboard
        run: npm ci

      - name: 🏗️ Build frontend
        working-directory: job-hunter-dashboard
        env:
          VITE_API_URL: https://job-hunter-saas-production.up.railway.app/api/v1
        run: npm run build

      - name: ✅ Build successful
        run: echo "✅ Frontend build OK"
