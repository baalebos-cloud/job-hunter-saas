name: 🚀 Baalebos AI Production Pipeline

on:
  push:
    branches: [ "main" ]

env:
  ECR_REGISTRY_URL: 251561352331.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 📦 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build and Push Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: job-hunter-repo
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ./backend/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOSTS }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/job-hunter-saas/

            # 1. Force Export of Real Secrets
            export OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export ECR_REGISTRY="${{ env.ECR_REGISTRY_URL }}"
            export ECR_REPOSITORY="job-hunter-repo"

            # 2. Authenticate Docker
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

            # 3. The "Clean Swap" - Stops old version to clear env cache
            sudo -E docker-compose -f docker-compose.prod.yml down
            sudo -E docker-compose -f docker-compose.prod.yml pull
            sudo -E docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4. Clean up
            sudo docker image prune -f
