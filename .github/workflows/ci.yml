name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Real OCR and the non-Latin fallback fonts. The tests that need them
      # skip when they are missing, so CI installs them to run those tests.
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng poppler-utils \
            fonts-noto-core fonts-wqy-zenhei

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest

      # backend/test/conftest.py sets DATABASE_URL=sqlite://, SECRET_KEY and
      # ENVIRONMENT=test, so no external services are needed.
      - name: Run tests
        run: python -m pytest backend/test -q -p no:warnings

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the job-local service container only.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-placeholder-not-a-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      # The migration bootstrap (fresh-DB create + stamp, legacy-DB stamp)
      # lives in backend/scripts/migrate.py. Until it is on the branch, the
      # raw Alembic chain cannot build an empty database, so the checks
      # below are skipped rather than failed.
      - name: Detect migration bootstrap
        id: detect
        run: |
          if [ -f backend/scripts/migrate.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migrations skipped::backend/scripts/migrate.py is not on this branch yet."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        if: steps.detect.outputs.present == 'true'
        run: pip install -r backend/requirements.txt

      - name: Migrate empty database
        if: steps.detect.outputs.present == 'true'
        run: python -m backend.scripts.migrate

      - name: Migrate again (idempotency)
        if: steps.detect.outputs.present == 'true'
        run: python -m backend.scripts.migrate

      - name: Check models match migrations
        if: steps.detect.outputs.present == 'true'
        run: alembic -c backend/alembic.ini check

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: job-hunter-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: job-hunter-dashboard/package-lock.json

      - run: npm ci
      - name: Resume Studio type check
        run: npm run typecheck:studio
      - name: Resume Studio tests (ATS analyzer, PDF engine, presets)
        run: npm run test:studio

      # `npm run lint` is not gated yet: the codebase has many pre-existing
      # react/prop-types errors.
      - run: npm run build

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate
        run: |
          status=0
          for dir in terraform terraform/bootstrap; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false || status=1
            terraform -chdir="$dir" validate || status=1
            echo "::endgroup::"
          done
          exit $status
