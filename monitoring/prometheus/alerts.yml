groups:
  - name: baalebos-api
    rules:
      - alert: ApiDown
        expr: up{job="baalebos-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The Baalebos API is not answering metrics scrapes.
      - alert: HighServerErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of API requests are failing with 5xx.
      - alert: SlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: API p95 latency is above 2 seconds.
      - alert: SignInFailureSpike
        expr: sum(increase(auth_login_attempts_total{outcome=~"failed|blocked"}[10m])) > 30
        labels: {severity: warning}
        annotations:
          summary: Over 30 failed or blocked sign-ins in 10 minutes (possible credential stuffing). Check Owner console → Security.
      - alert: DatabasePoolSaturated
        expr: max(db_pool_saturation_ratio) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Database connection pool is above 90% in use.
