version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: worker
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    networks:
      - app-network
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - OUTPUT_DIR=/app/output
    # Fixed the task path to match your project structure
    command: ["celery", "-A", "backend.app.tasks.celery_app", "worker", "--loglevel=info"]

  frontend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:frontend-latest
    container_name: frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - app-network
    command: ["serve", "-s", "dist", "-l", "3000"]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
