version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:latest
    container_name: backend
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8000:8000"  # This is internal, ALB will map 80/443 externally
    depends_on:
      - redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKER:-2}
      --proxy-headers
      --forwarded-allow-ips=*
      --timeout-keep-alive 30

  frontend:
    build:
      context: .
      dockerfile: ./job-hunter-dashboard/Dockerfile
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:frontend-latest
    container_name: frontend
    restart: always
    env_file:
      - .env.prod
    ports:
      - "3000:3000"
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      sh -c "next start -p 3000"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
