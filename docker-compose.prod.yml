services:
  backend:
    # Use the ECR image pulled by the pipeline
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:latest
    container_name: backend
    restart: always
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:latest
    container_name: worker
    restart: always
    environment:
      # The worker needs the API key to perform the AI resume analysis
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    networks:
      - app-network
    command: ["celery", "-A", "backend.app.tasks.celery_app", "worker", "--loglevel=info"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: 251561352331.dkr.ecr.us-east-1.amazonaws.com/job-hunter-repo:frontend-latest
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["serve", "-s", "dist", "-l", "3000"]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
