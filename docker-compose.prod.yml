version: '3.8'

services:
  backend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: backend
    restart: always
    # This line below is the "Magic Fix" that injects your .env variables
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: worker
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
      - backend
    networks:
      - app-network
    command: ["celery", "-A", "backend.app.tasks.celery_app", "worker", "--loglevel=info"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:frontend-latest
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["serve", "-s", "dist", "-l", "3000"]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
