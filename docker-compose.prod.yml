# =============================================================================
# BAALEBOS CLOUD — PRODUCTION
# =============================================================================
# Usage (on your EC2 instance):
#   docker-compose -f docker-compose.prod.yml pull
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml down
#
# Required environment variables (set in .env or GitHub Secrets):
#   ECR_REGISTRY_URL, ECR_REPOSITORY
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # FIX: No ports exposed in production — DB should never be public-facing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobhunter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    # FIX: No ports exposed in production — Redis should never be public-facing
    networks:
      - app-network
    volumes:
      - redis_data:/data              # FIX: Added persistence — was missing in prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------
  backend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production        # Restricts CORS to baalebo.xyz only
      - OUTPUT_DIR=/app/output
    ports:
      - "8000:8000"                   # Nginx proxies to this
    depends_on:
      db:
        condition: service_healthy    # FIX: Wait for DB healthcheck, not just container start
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # CELERY WORKER
  # ---------------------------------------------------------------------------
  worker:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: worker
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - OUTPUT_DIR=/app/output
    # FIX: Celery app path corrected — was 'backend.app.tasks.celery_app' which
    # points to a tasks subfolder file, not the main celery_app.py
    command: ["celery", "-A", "backend.app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output          # FIX: Must match backend volume so PDFs are shared
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:frontend-latest
    container_name: frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    command: ["serve", "-s", "dist", "-l", "3000"]

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:                         # FIX: Added — was missing, Redis had no named volume