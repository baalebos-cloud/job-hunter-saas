# =============================================================================
# BAALEBOS CLOUD — PRODUCTION
# =============================================================================

services:

  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobhunter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - app-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - OUTPUT_DIR=/app/output
    ports:
      - "8000:8000"
    command: ["/app/start.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: worker
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - OUTPUT_DIR=/app/output
    command: ["/app/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    networks:
      - app-network

  # FIX: Added beat service — was missing, causing Celery scheduled tasks to never run
  beat:
    image: ${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest
    container_name: beat
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    command: ["/app/start-beat.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
